[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "traceplane"
version = "0.1.0"
description = "CLI tool for converting and working with structured log/data files."
readme = "README.md"
requires-python = ">=3.7"
license = { text = "MIT" }
authors = [
  { name = "dedsec-terminal" }
]
dependencies = []

[project.optional-dependencies]
yaml = ["pyyaml"]
parquet = ["pyarrow", "pandas"]
sqlite = ["sqlite-utils"]
progress = ["tqdm"]
tdigest = ["tdigest"]

[project.scripts]
traceplane = "traceplane.cli:main"

[tool.setuptools.packages.find]
include = ["traceplane*", "tests*"]
